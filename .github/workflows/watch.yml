name: watch
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test_only:
        description: "텔레그램 테스트 메시지만 보내고 종료"
        type: boolean
        default: false

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Watch
        env:
          PAGE_URL: ${{ secrets.PAGE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ONLY: ${{ inputs.test_only }}
        run: python -u watch.py
